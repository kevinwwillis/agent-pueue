# git-cliff configuration for agent-pueue. https://git-cliff.org/docs/configuration
#
# Regenerate CHANGELOG.md from Conventional Commits and v* tags:
#   git-cliff -o CHANGELOG.md && markdownlint-cli2 --fix CHANGELOG.md
# Preview what the next release would contain:
#   git-cliff --unreleased
# Release commits ("chore: release ...") are skipped.

[changelog]
header = """
# agent-pueue changelog

Generated by git-cliff from Conventional Commits and `v*` tags; do not
edit by hand. Dates are UTC.
"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## Unreleased
{% endif %}{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}**breaking:** {% endif %}{{ commit.message | split(pat="
") | first | trim | upper_first }} (`{{ commit.id | truncate(length=7, end="") }}`)
{% endfor %}{% endfor %}
"""
trim = false
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^chore: release", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^chore|^ci|^build|^style", group = "<!-- 6 -->Maintenance" },
  { message = "^revert", group = "<!-- 7 -->Reverted" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
filter_commits = false
tag_pattern = "^v[0-9].*"
topo_order = false
sort_commits = "oldest"
